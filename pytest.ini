[pytest]
# Configuración pytest para pos_fifo_system.
#
# DJANGO_SETTINGS_MODULE: settings que usa pytest-django al inicializar.
#   Usamos los settings de development (config.settings); para correr
#   tests contra production no es necesario.
#
# testpaths: carpetas donde pytest busca tests. Por ahora solo
#   apps/facturacion_electronica/tests. Si en el futuro hay tests en
#   otras apps, ampliar.
#
# python_files: pytest solo considera archivos test_*.py. Los tests.py
#   default que Django genera al crear cada app NO se ejecutan (están
#   vacíos y no usamos la API de unittest de Django).
#
# --reuse-db: reusa la BD de tests entre corridas. La primera corrida
#   tarda en crearla; las siguientes son instantáneas. Si cambian
#   migraciones, agregar --create-db una vez para regenerarla.

DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = apps/facturacion_electronica/tests
addopts = --reuse-db -ra